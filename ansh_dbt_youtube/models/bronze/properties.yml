version: 2

models:
  - name: bronze_date # Matches the filename stg_customers.sql
    config:
      materialized: view
  - name: bronze_product
    config:
      materialized: view
  - name: bronze_sales
    columns:
      - name: sales_id # Matches a column in the model
        data_tests:
          - unique
          - not_null
      - name: gross_amount
        description: "Gross amount of the sale"
        data_tests:
          - generic_non_negative:
              arguments:
                column_name: gross_amount
  - name: bronze_store
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null
      - name: store_name
        description: "Name of the store"
        data_tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin','MegaMart San Jose','MegaMart Toronto']
              config:
                severity: warn    